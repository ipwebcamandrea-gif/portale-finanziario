name: Create Debug Bundle Reduced

on:
  workflow_dispatch:
    inputs:
      bundle_name:
        description: "Nome file bundle da generare"
        required: false
        default: "_DEBUG_PROJECT_BUNDLE_REDUCED.txt"
        type: string

permissions:
  contents: write

jobs:
  create-bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reduced text bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          output_name = os.environ.get("BUNDLE_NAME", "_DEBUG_PROJECT_BUNDLE_REDUCED.txt")
          output = Path(output_name)

          include_roots = [
              Path("pages"),
              Path("utils"),
              Path("components"),
              Path("css"),
              Path("portfolio"),
              Path(".streamlit/config.toml"),
              Path("main.py"),
              Path("app.py"),
              Path("streamlit_app.py"),
              Path("requirements.txt"),
              Path("README.md"),
          ]

          include_ext = {
              ".py",
              ".css",
              ".json",
              ".toml",
              ".txt",
              ".md",
              ".yml",
              ".yaml",
              ".ini",
          }

          exclude_path_prefixes = [
              ".git",
              ".github",
              "__pycache__",
              ".venv",
              "venv",
              "env",
              "_releases",
              "_zips",
              "_backups",
              "_reports",
          ]

          exclude_exact = {
              ".env",
              ".streamlit/secrets.toml",
              "secrets.toml",
              "_DEBUG_PROJECT_BUNDLE_REDUCED.txt",
              "_DEBUG_PROJECT_BUNDLE_FULL.txt",
          }

          def norm(path: Path) -> str:
              return path.as_posix().lstrip("./")

          def is_excluded(path: Path) -> bool:
              p = norm(path)

              if p in exclude_exact:
                  return True

              if Path(p).name.startswith("_DEBUG_PROJECT_BUNDLE"):
                  return True

              for prefix in exclude_path_prefixes:
                  prefix = prefix.strip("/")
                  if p == prefix or p.startswith(prefix + "/"):
                      return True

              return False

          def collect_files() -> list[Path]:
              files = []

              for root in include_roots:
                  if not root.exists():
                      continue

                  if root.is_file():
                      if root.suffix.lower() in include_ext and not is_excluded(root):
                          files.append(root)
                      continue

                  for path in root.rglob("*"):
                      if not path.is_file():
                          continue

                      if is_excluded(path):
                          continue

                      if path.suffix.lower() not in include_ext:
                          continue

                      files.append(path)

              return sorted(set(files), key=lambda p: norm(p).lower())

          files = collect_files()

          with output.open("w", encoding="utf-8", errors="replace") as out:
              out.write("# DEBUG PROJECT BUNDLE REDUCED\n")
              out.write("# Generated by GitHub Actions\n")
              out.write("# Included roots: pages, utils, components, css, portfolio, main/app files\n")
              out.write("# Excluded: .git, .github, secrets, env, backups, zips, releases, pycache\n\n")
              out.write(f"# Files included: {len(files)}\n\n")

              for path in files:
                  rel = norm(path)

                  out.write("\n\n")
                  out.write("=" * 100 + "\n")
                  out.write(f"===== FILE: {rel} =====\n")
                  out.write("=" * 100 + "\n\n")

                  try:
                      content = path.read_text(encoding="utf-8", errors="replace")
                  except Exception as exc:
                      content = f"[ERRORE LETTURA FILE: {exc}]"

                  out.write(content)
                  out.write("\n")

          print(f"Created {output} with {len(files)} files")
          PY
        env:
          BUNDLE_NAME: ${{ inputs.bundle_name }}

      - name: Commit bundle
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "${{ inputs.bundle_name }}"

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "debug: create reduced project bundle"
            git push
          fi
``
